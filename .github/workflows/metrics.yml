# Metrics Embed — https://github.com/marketplace/actions/metrics-embed
# Requires repository secret: METRICS_TOKEN (classic GitHub PAT)
#
# Most plugins use lowlighter/metrics@latest.
# Achievements uses dkhokhlov/metrics@master because official @latest still
# queries deprecated Projects (classic). Upstream: lowlighter/metrics#1769
#
# Steps run sequentially in one job to avoid PAT rate-limit storms.

name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/metrics.yml"
      - "README.md"

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila
          config_display: large
          extras_css: |
            .row {
              gap: 56px !important;
              column-gap: 56px !important;
            }
            .row > section {
              flex: 1 1 0;
              min-width: 0;
              padding-right: 8px;
            }
            .row > section + section {
              padding-left: 8px;
              border-left: 1px solid rgba(148, 163, 184, 0.18);
            }

      - name: Isometric calendar (half year)
        uses: lowlighter/metrics@latest
        with:
          filename: github-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Manila

      - name: Achievements
        uses: dkhokhlov/metrics@master
        with:
          filename: github-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: no
          plugin_achievements_display: compact
          plugin_achievements_limit: 6
          config_timezone: Asia/Manila
