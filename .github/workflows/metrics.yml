# Metrics Embed — https://github.com/marketplace/actions/metrics-embed
# Requires repository secret: METRICS_TOKEN (GitHub PAT)
# Docs: https://github.com/lowlighter/metrics

name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  # ── Base profile metrics ──────────────────────────────────────────────
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Manila

  # ── Isometric commit calendar ─────────────────────────────────────────
  isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Isometric calendar (half year)
        uses: lowlighter/metrics@latest
        with:
          filename: github-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Manila

      - name: Isometric calendar (full year)
        uses: lowlighter/metrics@latest
        with:
          filename: github-isocalendar-full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Manila

  # ── Languages activity ────────────────────────────────────────────────
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: github-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          config_timezone: Asia/Manila

  # ── Achievements ──────────────────────────────────────────────────────
  achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: github-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
          config_timezone: Asia/Manila

  # ── Recent activity ───────────────────────────────────────────────────
  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Recent activity
        uses: lowlighter/metrics@latest
        with:
          filename: github-activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          config_timezone: Asia/Manila

  # ── Coding habits ─────────────────────────────────────────────────────
  habits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          filename: github-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: millareskenneth
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Asia/Manila
